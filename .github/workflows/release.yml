name: Sovereign Engine Build & Windows Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build Native Rust Engine DLL
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Copy Compiled DLL to Root
      run: |
        copy target\x86_64-pc-windows-msvc\release\sovereign_compressor.dll .\sovereign_compressor.dll

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Publish Self-Contained Windows Executable
      run: |
        dotnet publish SovereignSSD.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:StartupObject=SovereignSSD.Program -o ./publish

    - name: Ensure DLL is in Publish Output
      run: |
        copy sovereign_compressor.dll publish\sovereign_compressor.dll

    - name: Install Inno Setup via Chocolatey
      run: |
        choco install innosetup --no-progress -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Compile Windows Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

    - name: Upload Windows Setup Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignSSD-Windows-v12-Installer
        path: Output/SovereignSSD-Setup-v12.exe
