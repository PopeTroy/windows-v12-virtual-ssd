name: Sovereign Engine CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build Rust Native Compressor DLL
      run: |
        cd native/compressor
        cargo build --release
        copy target/release/sovereign_compressor.dll ../../sovereign_compressor.dll

    - name: Build C# Sovereign Engine
      run: dotnet build SovereignEngine.csproj -c Release

    - name: Automated Engine Execution Test
      env:
        GITHUB_ACTIONS: "true"
      run: dotnet run --project SovereignEngine.csproj -c Release
