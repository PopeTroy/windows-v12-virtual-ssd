name: Build and Package SovereignSSD V12

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore SovereignSSD.csproj

    - name: Publish SovereignSSD Binary
      run: >
        dotnet publish SovereignSSD.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:StartupObject=SovereignSSD.Program 
        -o ./publish

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer with Inno Setup
      run: ISCC.exe setup.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignSSD-Setup-v12
        path: Output/SovereignSSD-Setup-v12.exe
        if-no-files-found: error
