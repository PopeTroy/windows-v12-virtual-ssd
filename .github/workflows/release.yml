name: Build and Package Space Time SSD V12

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore SovereignSSD.csproj

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Native C++ Engine & Tuners (MSVC)
      run: |
        cl.exe /O2 /LD /EHsc PidController.cpp /I. /Fe:sovereign_compressor.dll /link /DLL

    - name: Set up Python & Export ONNX / DDPG Models
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python AI Dependencies & Run Tuners
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python python_ddpg_ingest.py
        python export_onnx.py

    - name: Publish Space Time SSD Binary
      env:
        NVIDIA_DGX_API_KEY: ${{ secrets.NVIDIA_DGX_API_KEY }}
      run: >
        dotnet publish SovereignSSD.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:StartupObject=SovereignSSD.Program 
        -o "${{ github.workspace }}/publish"

    - name: Install Inno Setup
      shell: powershell
      run: |
        choco install innosetup --no-progress -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Ensure Output Directory Exists
      run: mkdir "${{ github.workspace }}/Output"

    - name: Download and Convert Branding Assets
      shell: powershell
      run: |
        # Download Banner Image
        Invoke-WebRequest -Uri "https://celsiustechmediagroup.co.za/wp-content/uploads/2026/08/1787394286450.png" -OutFile "setup_banner_temp.png"
        
        # Download Logo Image
        Invoke-WebRequest -Uri "https://celsiustechmediagroup.co.za/wp-content/uploads/2026/08/craiyon_113827_image-2.png" -OutFile "vssdhx_logo_temp.png"

        Add-Type -AssemblyName System.Drawing

        # Convert Banner to 24-bit BMP
        $srcBanner = [System.Drawing.Bitmap]::FromFile("setup_banner_temp.png")
        $bmpBanner = New-Object System.Drawing.Bitmap($srcBanner.Width, $srcBanner.Height, [System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
        $gBanner = [System.Drawing.Graphics]::FromImage($bmpBanner)
        $gBanner.DrawImage($srcBanner, 0, 0, $srcBanner.Width, $srcBanner.Height)
        $bmpBanner.Save("setup_banner.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
        $gBanner.Dispose()
        $bmpBanner.Dispose()
        $srcBanner.Dispose()

        # Convert Logo to Small Header BMP
        $srcLogo = [System.Drawing.Bitmap]::FromFile("vssdhx_logo_temp.png")
        $bmpSmall = New-Object System.Drawing.Bitmap(55, 55, [System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
        $gSmall = [System.Drawing.Graphics]::FromImage($bmpSmall)
        $gSmall.DrawImage($srcLogo, 0, 0, 55, 55)
        $bmpSmall.Save("vssdhx_logo_small.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
        $gSmall.Dispose()
        $bmpSmall.Dispose()

        # Generate Valid Windows .ICO Header and Binary Structure
        $icoBitmap = New-Object System.Drawing.Bitmap($srcLogo, 32, 32)
        $hIcon = $icoBitmap.GetHicon()
        $icon = [System.Drawing.Icon]::FromHandle($hIcon)
        $fs = [System.IO.File]::Create("vssdhx_logo.ico")
        $icon.Save($fs)
        $fs.Close()
        $icoBitmap.Dispose()
        $srcLogo.Dispose()

    - name: Build Installer with Inno Setup
      run: >
        ISCC.exe 
        /DSourcePath="${{ github.workspace }}/publish/SovereignSSD.exe" 
        /O"${{ github.workspace }}/Output" 
        "${{ github.workspace }}/installer.iss"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VSSDHX-Setup-v144
        path: Output/*.exe
        if-no-files-found: error
