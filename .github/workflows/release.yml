name: Build Sovereign Virtual SSD Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub Actions UI

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore SovereignSSD.csproj

    - name: Build Project
      run: dotnet build SovereignSSD.csproj --configuration Release --no-restore

    - name: Test Pipeline Compilation
      env:
        NVIDIA_DGX_API_KEY: ${{ secrets.NVIDIA_DGX_API_KEY }}
        SOVEREIGN_PARTITION_ID: "PART-CI-BUILD-TEST"
      run: dotnet run --project SovereignSSD.csproj --no-build --configuration Release -- -test-run

    # Compiles a single-file standalone Windows executable (.exe)
    - name: Publish Standalone Executable
      run: dotnet publish SovereignSSD.csproj --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/

    # Uploads SovereignVirtualSSD.exe as a downloadable GitHub Artifact
    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignVirtualSSD-Windows-x64
        path: publish/*.exe
