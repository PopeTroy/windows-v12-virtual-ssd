name: Build and Package Space Time SSD V12

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore SovereignSSD.csproj

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Native C++ Engine & Tuners (MSVC)
      run: |
        cl.exe /O2 /LD /EHsc PidController.cpp /I. /Fe:sovereign_compressor.dll /link /DLL

    - name: Set up Python & Export ONNX / DDPG Models
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python AI Dependencies & Run Tuners
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python python_ddpg_ingest.py
        python export_onnx.py

    - name: Publish Space Time SSD Binary
      env:
        NVIDIA_DGX_API_KEY: ${{ secrets.NVIDIA_DGX_API_KEY }}
      run: >
        dotnet publish SovereignSSD.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:StartupObject=SovereignSSD.Program 
        -o "${{ github.workspace }}/publish"

    - name: Install Inno Setup
      shell: powershell
      run: |
        choco install innosetup --no-progress -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Ensure Output Directory Exists
      run: mkdir "${{ github.workspace }}/Output"

    - name: Download and Convert Branding Assets
      shell: powershell
      run: |
        # Download Banner Image
        Invoke-WebRequest -Uri "https://celsiustechmediagroup.co.za/wp-content/uploads/2026/08/1787394286450.png" -OutFile "setup_banner_temp.png"
        
        # Download Logo Image
        Invoke-WebRequest -Uri "https://celsiustechmediagroup.co.za/wp-content/uploads/2026/08/craiyon_113827_image-2.png" -OutFile "vssdhx_logo_temp.png"

        # Convert images to System Bitmaps via System.Drawing (.NET)
        Add-Type -AssemblyName System.Drawing

        # Convert Banner to setup_banner.bmp
        $bmpBanner = [System.Drawing.Image]::FromFile("setup_banner_temp.png")
        $bmpBanner.Save("setup_banner.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
        $bmpBanner.Dispose()

        # Convert Logo to Small Header BMP
        $bmpLogo = [System.Drawing.Image]::FromFile("vssdhx_logo_temp.png")
        $bmpLogo.Save("vssdhx_logo_small.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)

        # Convert Logo to Icon File (.ico)
        $iconStream = New-Object System.IO.MemoryStream
        $bmpLogo.Save($iconStream, [System.Drawing.Imaging.ImageFormat]::Png)
        $bmpLogo.Dispose()

        # Create basic .ICO container from bitmap
        [System.Drawing.Bitmap]::FromFile("vssdhx_logo_temp.png").Save("vssdhx_logo.ico", [System.Drawing.Imaging.ImageFormat]::Icon)

    - name: Build Installer with Inno Setup
      run: >
        ISCC.exe 
        /DSourcePath="${{ github.workspace }}/publish/SovereignSSD.exe" 
        /O"${{ github.workspace }}/Output" 
        "${{ github.workspace }}/installer.iss"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SovereignSSD-Setup-v12
        path: Output/SovereignSSD-Setup-v12.exe
        if-no-files-found: error
