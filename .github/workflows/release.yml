name: Sovereign Compressor CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libsovereign_compressor.so
            rust_dylib_path: target/release/libsovereign_compressor.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sovereign_compressor.dll
            rust_dylib_path: target/release/sovereign_compressor.dll

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 1. SETUP TOOLCHAINS (RUST & .NET)
      # ---------------------------------------------------------------------
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------------------------------------------------------------
      # 2. BUILD NATIVE RUST DYLIB
      # ---------------------------------------------------------------------
      - name: Build Rust Engine (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify Compiled Native Library Exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.rust_dylib_path }}" ]; then
            echo "Error: Compiled artifact not found at ${{ matrix.rust_dylib_path }}"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # 3. STAGE NATIVE BINARY FOR DOTNET P/INVOKE
      # ---------------------------------------------------------------------
      - name: Copy Native Library to Test Output Directories
        shell: bash
        run: |
          # Create target bin directories for dotnet test lookup
          mkdir -p SovereignEngine.Tests/bin/Release/net8.0/
          mkdir -p SovereignEngine.Tests/bin/Debug/net8.0/
          
          # Copy dylib into test runner execution context
          cp ${{ matrix.rust_dylib_path }} SovereignEngine.Tests/bin/Release/net8.0/
          cp ${{ matrix.rust_dylib_path }} SovereignEngine.Tests/bin/Debug/net8.0/

      # ---------------------------------------------------------------------
      # 4. RUN C# XUNIT TESTS & CARGO BENCH MARKS
      # ---------------------------------------------------------------------
      - name: Run .NET Unit Tests
        run: dotnet test SovereignEngine.Tests/SovereignEngine.Tests.csproj --configuration Release --logger "console;verbosity=detailed"

      - name: Verify Cargo Benchmarks Compile
        run: cargo bench --no-run

      # ---------------------------------------------------------------------
      # 5. UPLOAD NATIVE BUILD ARTIFACTS
      # ---------------------------------------------------------------------
      - name: Upload Native Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-sovereign-compressor-${{ matrix.os }}
          path: ${{ matrix.rust_dylib_path }}
          if-no-files-found: error
