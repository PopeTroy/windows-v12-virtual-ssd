[package]
name = "sovereign_compressor"
version = "0.1.0"
edition = "2021"

[lib]
name = "sovereign_compressor"
crate-type = ["cdylib", "rlib"]

[dependencies]
zstd = "0.13"
rayon = "1.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compression_throughput"
harness = false
